plugins { id 'com.android.application' }
android {
    namespace 'com.smartcam.capture'
    compileSdk 35
    defaultConfig {
        applicationId 'com.detectcam.app'
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.smartcam.capture.BoardTests'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Checked-in bridge/runtime from the existing locally built RK3588 application.
    // To rebuild native code, supply matching headers/runtime through rknnSdkDir.
    def sdk = project.findProperty('rknnSdkDir')
    if (sdk) {
        sourceSets.main.jniLibs.srcDirs = []
        ndkVersion '26.3.11579264'
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.1' } }
        defaultConfig.externalNativeBuild.cmake.arguments '-DRKNN_SDK_DIR=' + sdk
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
